# ============================================================================
# Configuración del backend (Spring Boot)
# Todas las credenciales llegan por variables de entorno; los valores tras ":"
# son solo para desarrollo local.
# ============================================================================

spring:
  application:
    name: buscador-cromos-api

  # Conexión a PostgreSQL. En producción (Render) apunta a Neon:
  # DATABASE_URL=jdbc:postgresql://<host-neon>/<db>?sslmode=require
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cromos}
    username: ${DATABASE_USER:cromos}
    password: ${DATABASE_PASS:cromos}

  jpa:
    # Sin Open Session in View: evita accesos LAZY accidentales fuera de transacción
    open-in-view: false
    # El esquema lo gestiona Flyway, Hibernate no toca las tablas
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  # Migraciones SQL en classpath:db/migration (V1__schema.sql)
  flyway:
    locations: classpath:db/migration

# Render inyecta PORT; en local queda el 8080 clásico
server:
  port: ${PORT:8080}

app:
  jwt:
    # Secreto HMAC para firmar tokens. ¡CAMBIAR en producción!
    secret: ${JWT_SECRET:dev-secret-cambiar-en-produccion-0123456789abcdef0123456789abcdef}
    # Vigencia del token: 604800000 ms = 7 días
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cors:
    # Orígenes web permitidos, separados por comas
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
