# Blueprint de Render: crea el servicio del backend desde este repo.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: buscador-cromos-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    # Configura en el panel de Render (Environment):
    #   DATABASE_URL          jdbc:postgresql://<host-neon>/<db>?sslmode=require
    #   DATABASE_USER         <usuario de Neon>
    #   DATABASE_PASS         <contraseña de Neon>
    #   JWT_SECRET            <cadena larga aleatoria>
    #   CORS_ALLOWED_ORIGINS  https://<tu-sitio>.netlify.app
