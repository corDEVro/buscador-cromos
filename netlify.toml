# Netlify: frontend React + proxy de /api al backend en Render.
# Sustituye REEMPLAZA-TU-BACKEND por la URL de tu servicio de Render.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[[redirects]]
  from = "/api/*"
  to = "https://REEMPLAZA-TU-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
