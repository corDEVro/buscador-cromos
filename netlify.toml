# Netlify: frontend React + proxy de /api al backend en Render.

[build]
  base = "frontend"
  command = "npm run build"
  # Netlify resuelve esta ruta UNIÉNDOLA a `base` → <repo>/frontend/dist
  publish = "dist"

[build.environment]
  # Fija la versión de Node para que coincida con la del desarrollo (Vite 8 la exige).
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/*"
  to = "https://buscador-cromos.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
